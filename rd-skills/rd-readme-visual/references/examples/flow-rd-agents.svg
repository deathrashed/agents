.chip{fill:#2d2d2d;stroke:#454545;stroke-width:1}
.lit{animation:lit 9.0s cubic-bezier(.22,1,.36,1) infinite}
@keyframes lit{0%{fill:#2d2d2d;stroke:#454545}4%{fill:#4f4717;stroke:#ffda00}86%{fill:#4f4717;stroke:#ffda00}95%,100%{fill:#2d2d2d;stroke:#454545}}
.litb{animation:litb 9.0s cubic-bezier(.22,1,.36,1) infinite}
@keyframes litb{0%{fill:#2d2d2d;stroke:#454545}4%{fill:#424344;stroke:#e6edf3}86%{fill:#424344;stroke:#e6edf3}95%,100%{fill:#2d2d2d;stroke:#454545}}
.node{fill:#2d2d2d;stroke:#454545;stroke-width:1.4;animation:node 9.0s cubic-bezier(.22,1,.36,1) infinite}
@keyframes node{0%{fill:#2d2d2d;stroke:#454545;r:12}3%{fill:#ffda00;stroke:#ffee8c;r:16}8%{fill:#7c6c11;stroke:#ffda00;r:12}86%{fill:#7c6c11;stroke:#ffda00;r:12}95%,100%{fill:#2d2d2d;stroke:#454545;r:12}}
.lab{opacity:.35;animation:lab 9.0s linear infinite}
@keyframes lab{0%{opacity:.35}4%,86%{opacity:1}95%,100%{opacity:.35}}
.spoke{fill:none;stroke:#ffda00;stroke-width:1.3;stroke-dasharray:3 7;opacity:.5;animation:dash 1.4s linear infinite}
.plug{fill:none;stroke:#e6edf3;stroke-width:1.6;stroke-dasharray:3 7;opacity:.6;animation:dash 1.4s linear infinite}
@keyframes dash{to{stroke-dashoffset:-20}}
.ring{fill:none;stroke:#ffda00;stroke-width:2;transform-box:fill-box;transform-origin:center;opacity:0;animation:ring 9.0s cubic-bezier(.22,1,.36,1) infinite;animation-delay:1.5s}
@keyframes ring{0%{transform:scale(1);opacity:.9}18%,100%{transform:scale(1.9);opacity:0}}
.tick{fill:none;stroke:#11d116;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:24;stroke-dashoffset:24;animation:draw 9.0s cubic-bezier(.22,1,.36,1) infinite}
@keyframes draw{0%{stroke-dashoffset:24}4%,86%{stroke-dashoffset:0}95%,100%{stroke-dashoffset:24}}
.badge{opacity:0;animation:badge 9.0s cubic-bezier(.22,1,.36,1) infinite}
@keyframes badge{0%{opacity:0;transform:translateX(-6px)}5%,86%{opacity:1;transform:none}95%,100%{opacity:0}}
.cur{fill:#ffda00;animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){
.pkt,.cur,.ring{display:none}
.spoke,.plug{animation:none}
.lit{animation:none;fill:#4f4717;stroke:#ffda00}
.litb{animation:none;fill:#424344;stroke:#e6edf3}
.node{animation:none;fill:#7c6c11;stroke:#ffda00}
.lab,.badge{animation:none;opacity:1}
.tick{animation:none;stroke-dashoffset:0}
}
</style>
