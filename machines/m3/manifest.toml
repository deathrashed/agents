# ~/.agents/manifest.toml: third-party agent tools on this machine (m3).
# Hand-maintained. Update it whenever a tool is installed, upgraded, rewired
# or removed (see rules/tools.md, "Token savers").
# owner: self = installed and upgraded by rd directly; cc-presets = lives
#        under ~/.local/share/cc-presets.
# Last checked: 2026-11-16 (native, m3.local; token savers t18).

[tools.rtk]
owner     = "self"
version   = "1.2.0"                       # rtk --version (upgraded from 0.44.2 on 2026-11-15)
edition   = "oss"                         # Apache-2.0 build, no BUSL engine
source    = "https://github.com/rtk-ai/rtk/releases/tag/v1.2.0"
install   = "RTK_EDITION=oss RTK_VERSION=v1.2.0 RTK_INSTALL_DIR=~/.local/bin sh install.sh  # installer checks checksums.txt"
binary    = "~/.local/bin/rtk"
telemetry = "off"                         # rtk telemetry status -> consent: no
status    = "active"
[tools.rtk.agents]
claude   = "PreToolUse Bash hook `rtk hook claude` (rtk init -g --hook-only, 2026-11-15); CLAUDE.md is now the shared link, so ~/.claude/RTK.md is no longer imported"
opencode = "plugin ~/.config/opencode/plugins/rtk.ts (rtk init --show)"
codex  = "PreToolUse Bash hook `rtk hook codex` in ~/.codex/hooks.json + cc-presets bundle codexHooks (hook from rtk init -g --codex, merged by hand so ~/.codex/AGENTS.md stays untouched; 2026-11-16). Tested: git status -> rtk git status"
omp    = "extension ~/.config/pi/extensions/rtk.ts (shared with pi; rtk init -g --agent omp, 2026-11-16)"
cursor = "preToolUse hook `rtk hook cursor` in ~/.cursor/hooks.json (rtk init -g --agent cursor, 2026-11-16)"
note   = "cc-presets hook.mjs cannot read its hook-config.json (new URL(import.meta.url).pathname keeps %E2%80%8B from the /Volumes/Apfspace/<zero-width-space>/ path), so every remaining `hook.mjs` hook (context-mode x6, legacy gsd) prints {}; the dead hook.mjs rtk entry was removed 2026-11-16"

[tools.context-mode]
owner     = "cc-presets"
version   = "1.0.169"                     # runtime/node_modules/context-mode/package.json
source    = "https://github.com/mksglu/context-mode"
binary    = "~/.local/bin/context-mode"   # wrapper -> cc-presets cli.bundle.mjs
telemetry = "none"
status    = "hooks wired in Codex but INACTIVE"   # hook.mjs fails open (see tools.rtk.agents.note); left in place by rd's choice
[tools.context-mode.agents]
codex = "hooks via cc-presets (`codex context …`, 6 events); MCP entry enabled = false"

[tools.rea]
owner     = "self"
version   = "6.7.0"                       # pinned in ~/.codex/config.toml args
source    = "https://github.com/morluto/rea"
data      = "~/.local/share/rea"
telemetry = "none found"
status    = "configured, disabled"        # no rea on PATH
[tools.rea.agents]
codex = "MCP `rea` (npx rea-agents@6.7.0 mcp), enabled = false"

[tools.caveman]
owner     = "self"                        # upstream 4.x suite; cc-presets cli 1.3.4 removed 2026-11-16
version   = "4.1.0"                       # Claude plugin caveman@caveman; Codex installer v4.1.0 (1e91f13)
source    = "https://github.com/JuliusBrussee/caveman/releases/tag/v4.1.0"
install   = "claude plugin update caveman@caveman ; node installer/install.js --only codex (from a v4.1.0 clone, --dry-run first)"
telemetry = "off"                         # ~/.caveman-cloud/config.json telemetry.enabled = false (kept); upstream CLI/rocks not installed
status    = "Codex always-on; Claude on demand"
removed   = "1.3.4: ~/.caveman/bin (Trash), ~/.local/bin/caveman wrapper (Trash), @caveman-ai/cli in cc-presets runtime (npm uninstall), Codex [mcp_servers.caveman] + cc-caveman skill entry, all cc-presets bundle/hook-config refs (2026-11-16)"
data      = "~/.caveman (mem, dbs, receipts; kept)"
[tools.caveman.agents]
codex    = "SessionStart hook ~/.codex/caveman/hooks/codex-sessionstart.js (trust once with /hooks) + 22 skills in ~/.agents/skills"
claude   = "plugin caveman@caveman 4.1.0 enabled, CAVEMAN_DEFAULT_MODE=manual (on demand; ponytail is Claude's always-on style)"
opencode = "skipped: installer writes an AGENTS.md block"
grok     = "skipped: installer writes a ~/.grok/AGENTS.md block"

[tools.headroom]
owner     = "self"                        # pip --user: ~/Library/Python/3.12/bin/headroom
version   = "0.44.0"
source    = "https://github.com/headroomlabs-ai/headroom"
telemetry = "off"                         # fish universal HEADROOM_TELEMETRY=off + HEADROOM_BEACON=off, launchctl setenv both; `headroom telemetry` -> Upload beacon OFF
status    = "per session only"            # `headroom wrap <agent>`; no permanent *_BASE_URL; port 8787 not listening
note      = "update check (HEADROOM_UPDATE_CHECK) is separate from telemetry and left at default"

[tools.ponytail]
owner     = "self"
version   = "5.3.3"
source    = "https://github.com/DietrichGebert/ponytail/releases/tag/v5.3.3"
telemetry = "none"                        # ledger = local CSV under ~/.config/ponytail; fetch only if webhookUrl is set (empty)
status    = "active (always-on reply style)"
[tools.ponytail.agents]
claude   = "plugin ponytail@ponytail (marketplace DietrichGebert/ponytail)"
opencode = "plugin @dietrichgebert/ponytail in opencode.json"
omp      = "plugin ponytail@ponytail (omp plugin marketplace)"
grok     = "plugin ponytail (grok plugin install --trust; [plugins] enabled)"
kilo     = "\"plugin\": [\"@dietrichgebert/ponytail\"] in ~/.config/kilo/kilo.jsonc"
cursor   = "sessionStart + beforeSubmitPrompt hooks in ~/.cursor/hooks.json from ~/Projects/_forks/ponytail (v5.3.3 clone)"
codex    = "not installed (by design)"

[tools.claude-mem]
owner     = "self"                        # Claude plugin claude-mem@thedotmack
version   = "15.18.3"                     # per installed_plugins.json
source    = "https://github.com/thedotmack/claude-mem"
binary    = "~/.local/bin/claude-mem"
data      = "~/.claude-mem"
telemetry = "unchecked"                   # [UNVERIFIED]
status    = "active"
[tools.claude-mem.agents]
claude = "plugin enabled"
codex  = "MCP `claude-mem` enabled"
gemini = "wrote a <claude-mem-context> block into ~/.gemini/GEMINI.md at install"
rules  = "writes ~/.agents/rules/claude-mem-context.md"

[skills]
manager     = "npx skills"
lockfile    = "~/.local/state/skills/.skill-lock.json"   # 206 entries on 2026-11-15
install_dir = "~/.agents/skills"
# 2026-11-16: ~/.agents rebuilt fresh; old tree (incl. stale 3-entry lock, skillz/) is ~/Archive/agents-archive
contents    = "171 npx-skills (lock) + Codex .system + 59 gstack (kept; gstack source ~/.claude/skills/gstack is missing, so they are empty shells until gstack is reinstalled) + rd's own: 23 riley dirs + mac-disk-audit, rename-chat, new-repo"
shared_with = "~/.codex/skills and ~/.cursor/skills are links to ~/.agents/skills"
other_writers = "skillshare: ~/.agents/skills target removed (claude target kept; _riley source = links into ~/.agents/skills); cc-switch: links dropped, app not installed; ghostex: links trashed"
