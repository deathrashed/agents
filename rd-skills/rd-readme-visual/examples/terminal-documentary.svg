<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="360" viewBox="0 0 1100 360" role="img" aria-labelledby="t desc"><title id="t">AUDIO / ROUTING ENGINE</title><desc id="desc">INPUT → NORMALIZE → TAG → EXPORT  •  DETERMINISTIC SIGNAL MAP. Decorative animation is optional; all information is visible without motion.</desc><style>text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace} .muted{fill:#747A84} .fg{fill:#F5F5F5} .accent{fill:#FFDA00} @keyframes march{to{stroke-dashoffset:-42}} @keyframes glow{50%{opacity:.8}} @keyframes sweep{to{transform:translateX(1080px)}} .flow{animation:march 3s linear infinite} .beacon{animation:glow 2.4s ease-in-out infinite} .scan{animation:sweep 7s linear infinite} @media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important}} </style><rect width="1100" height="360" fill="#101115"/><rect x="26" y="26" width="1048" height="308" rx="9" fill="none" stroke="#747A84" stroke-opacity=".6"/><path d="M26 68H1074" stroke="#747A84" stroke-opacity=".45"/><circle cx="48" cy="47" r="5" fill="#FC6A67"/><circle cx="71" cy="47" r="5" fill="#F5C65B"/><circle cx="94" cy="47" r="5" fill="#5BCBA9"/><text x="1042" y="51" text-anchor="end" font-size="12" fill="#747A84">LOG / AUDIO / ROUTING ENGINE</text><text x="58" y="114" font-size="17" fill="#FFDA00" opacity="1">$ audio-agent inspect --json</text><text x="1019" y="114" font-size="11" fill="#747A84" text-anchor="end">01</text><text x="58" y="151" font-size="17" fill="#F5F5F5" opacity="0.85">[ok] metadata providers connected</text><text x="1019" y="151" font-size="11" fill="#747A84" text-anchor="end">02</text><text x="58" y="188" font-size="17" fill="#F5F5F5" opacity="0.85">[ok] normalization pipeline ready</text><text x="1019" y="188" font-size="11" fill="#747A84" text-anchor="end">03</text><text x="58" y="225" font-size="17" fill="#F5F5F5" opacity="0.85">&gt; select artist or album</text><text x="1019" y="225" font-size="11" fill="#747A84" text-anchor="end">04</text><rect class="beacon" x="58" y="264" width="11" height="19" fill="#FFDA00"/></svg>