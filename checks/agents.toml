# Per-tool map of where each agent reads instructions, skills, MCP servers and
# hooks. Read by scripts/agents-check. Paths use "~". Machine sections:
#   [tools.<id>.<machine>] where <machine> is a key under [machines].
# Fields:
#   instructions  global instruction files the tool reads (first match wins)
#   skills        skill dirs the tool loads at user level, in load order
#   mcp           MCP config files (names only; values are never printed)
#   hooks         hook config files/dirs the tool reads
#   reads_agents_skills / reads_agents_md   true | false | "via-link" | "unverified"
#   proof         where the facts come from (docs URL, source strings, or disk)
# Verified on cachy 2026-11-14. Mac (m3) entries are [UNVERIFIED] until checked there.

[machines.cachy]
hostname = "cachy"
os = "linux"
npx_lock = "~/.local/state/skills/.skill-lock.json"

[machines.m3]
hostname = "m3"                      # also matches m3.local
os = "darwin"
npx_lock = "~/.local/state/skills/.skill-lock.json"   # [UNVERIFIED] on m3
unverified = true

[shared]
agents_dir = "~/.agents"
agents_md = "~/.agents/AGENTS.md"
main_md = "~/.agents/main.md"
repo = "~/projects/rd-agents"
output_tools = ["rtk", "context-mode", "caveman"]
repo_ignore = ["rules/claude-mem-context.md"]   # machine-generated by claude-mem, kept out of the repo on purpose

[tools.claude]
name = "Claude Code"
instructions = ["~/.claude/CLAUDE.md"]
skills = ["~/.claude/skills"]
mcp = ["~/.claude.json"]
hooks = ["~/.claude/settings.json"]
plugins = "~/.claude/plugins/installed_plugins.json"
reads_agents_skills = "via-link"     # only ~/.claude/skills; most entries are links into ~/.agents/skills
reads_agents_md = "via-link"         # ~/.claude/CLAUDE.md -> ../.agents/AGENTS.md
proof = "https://code.claude.com/docs/en/skills ; disk: readlink ~/.claude/CLAUDE.md"

[tools.codex]
name = "Codex CLI"
instructions = ["~/.codex/AGENTS.md"]
skills = ["~/.agents/skills", "~/.codex/skills"]
mcp = ["~/.codex/config.toml"]
hooks = ["~/.codex/hooks.json"]
reads_agents_skills = true
reads_agents_md = "via-link"
proof = "https://developers.openai.com/codex/skills (USER scope $HOME/.agents/skills) ; https://developers.openai.com/codex/guides/agents-md"

[tools.cursor-agent]
name = "Cursor (IDE + cursor-agent CLI)"
instructions = ["~/.cursor/rules/main.mdc"]   # user rules otherwise live in app settings, not on disk
skills = ["~/.agents/skills", "~/.cursor/skills"]
mcp = ["~/.cursor/mcp.json"]
hooks = ["~/.cursor/hooks.json"]
reads_agents_skills = true
reads_agents_md = "pointer"          # main.mdc tells it to read ~/.agents/main.md; whether ~/.cursor/rules is loaded globally: [UNVERIFIED]
proof = "https://cursor.com/docs/context/skills ('~/.agents/skills/ User-level')"

[tools.grok]
name = "Grok CLI (grok)"
instructions = ["~/.grok/rules", "~/.claude/CLAUDE.md"]   # ~/.grok/rules/*.md + Claude compat (named files under ~/.claude/)
skills = ["~/.grok/skills", "~/.claude/skills", "~/.agents/skills"]
mcp = ["~/.grok/config.toml"]
hooks = ["~/.grok/hooks", "~/.grok/config.toml", "~/.claude/settings.json", "~/.cursor/hooks.json"]
reads_agents_skills = true
reads_agents_md = "via-link"         # through Claude compatibility; ~/.grok/rules does not exist
proof = "~/.grok/docs/user-guide/08-skills.md:23-29, 12-project-rules.md:40-45, 10-hooks.md:64-75"

[tools.grokbot]
name = "Grok Bot desktop app (pkg grok-bot-cursor)"
instructions = []
skills = []
mcp = []
hooks = []
reads_agents_skills = false
reads_agents_md = false
note = "Electron app data only in ~/.config/Grok Bot (no instruction, skill or MCP files on cachy); its agents run remotely."
proof = "pacman -Ql grok-bot-cursor (/opt/Grok); ls ~/.config/'Grok Bot'"

[tools.omp]
name = "oh-my-pi (omp)"
instructions = ["~/.omp/agent/AGENTS.md", "~/.codex/AGENTS.md"]
skills = ["~/.omp/agent/managed-skills", "~/.claude/skills", "~/.codex/skills", "~/.agents/skills"]
mcp = ["~/.omp/agent/mcp.json"]
hooks = ["~/.omp/agent/hooks", "~/.omp/agent/extensions"]
reads_agents_skills = "unverified"   # string present in binary; global vs project scope not confirmed
reads_agents_md = "unverified"       # binary references ~/.codex/AGENTS.md (a link to the shared file)
proof = "rg -a strings in /usr/bin/omp (omp 18.19.0)"

[tools.pi]
name = "pi coding agent"
instructions = ["~/.pi/agent/AGENTS.md"]
skills = ["~/.pi/agent/skills"]
mcp = []
hooks = ["~/.pi/agent/extensions"]
reads_agents_skills = "unverified"
reads_agents_md = "via-link"
proof = "disk: ~/.pi/agent/AGENTS.md -> ../../.agents/AGENTS.md"

[tools.opencode]
name = "opencode"
instructions = ["~/.config/opencode/AGENTS.md"]
skills = ["~/.claude/skills", "~/.agents/skills", "~/.config/opencode/skills"]
mcp = ["~/.config/opencode/opencode.json"]
hooks = ["~/.config/opencode/plugins"]
reads_agents_skills = true
reads_agents_md = "via-link"
proof = "https://opencode.ai/docs/skills/ (Discovery + Precedence)"

[tools.kilo]
name = "Kilo CLI"
instructions = []                    # global instructions only via the `instructions` key in kilo.jsonc (unset)
skills = ["~/.agents/skills", "~/.kilo/skills"]   # ~/.claude/skills only with Claude Code Compatibility on
mcp = ["~/.config/kilo/kilo.jsonc"]
hooks = ["~/.config/kilo/plugin", "~/.config/kilo/plugins"]
reads_agents_skills = true
reads_agents_md = false
proof = "https://kilo.ai/docs/customize/skills ; https://kilo.ai/docs/customize/agents-md (Global = `instructions` in kilo.jsonc)"

[tools.agy]
name = "Antigravity (agy CLI / IDE)"
instructions = ["~/.gemini/GEMINI.md"]
skills = ["~/.agents/skills", "~/.gemini/antigravity/skills", "~/.gemini/antigravity/global_skills", "~/.gemini/config/skills"]
mcp = ["~/.gemini/antigravity/mcp_config.json", "~/.gemini/config/mcp_config.json"]
hooks = ["~/.gemini/config/hooks.json"]
reads_agents_skills = "unverified"   # "/.agents/skills/" string in /usr/bin/agy; 118 of 124 antigravity/skills entries link into ~/.agents/skills
reads_agents_md = "via-link"         # ~/.gemini/GEMINI.md -> ../.agents/AGENTS.md
proof = "rg -a strings in /usr/bin/agy (1.5.7); disk links"

[tools.gemini]
name = "Gemini CLI"
instructions = ["~/.gemini/GEMINI.md"]
skills = ["~/.gemini/skills", "~/.agents/skills"]
mcp = ["~/.gemini/settings.json"]
hooks = ["~/.gemini/settings.json"]
reads_agents_skills = "unverified"
reads_agents_md = "via-link"
proof = "disk: ~/.gemini/GEMINI.md link"

[providers.openrouter]
name = "OpenRouter (API provider, not an agent)"
referenced_in = ["~/.codex/config.toml ([model_providers.openrouter], key from a command)", "~/.config/opencode/plugins/claude-mem.js"]
note = "No other agent config on cachy mentions it. Key values are never read or printed."

# Mac (m3): same tool ids expected; every path above is [UNVERIFIED] there.
